
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FriendlyEats{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 20px;
        }

        nav {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #e5e7eb;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <h1>🍽️ FriendlyEats</h1>

            <div>
                <a href="/">Inicio</a>
                <a href="/restaurants">Restaurantes</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>FriendlyEats - Encuentra tu restaurante favorito</p>
    </footer>

</body>
</html>
