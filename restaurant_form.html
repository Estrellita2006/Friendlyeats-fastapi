
{% extends "base.html" %}

{% block title %}{{ title }} | FriendlyEats{% endblock %}

{% block content %}

<div style="background-color: white;
            max-width: 650px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);">

    <h2 style="color: #2563eb;">{{ title }}</h2>

    <form action="{{ action }}" method="post">

        <label>Nombre del restaurante:</label>
        <input type="text"
               name="name"
               value="{{ restaurant.name if restaurant else '' }}"
               required
               style="width: 100%; padding: 10px; margin: 10px 0 20px;">

        <label>Categoría:</label>
        <input type="text"
               name="category"
               value="{{ restaurant.category if restaurant else '' }}"
               required
               style="width: 100%; padding: 10px; margin: 10px 0 20px;">

        <label>Ciudad:</label>
        <input type="text"
               name="city"
               value="{{ restaurant.city if restaurant else '' }}"
               required
               style="width: 100%; padding: 10px; margin: 10px 0 20px;">

        <label>Nivel de precio (1, 2 o 3):</label>
        <input type="number"
               name="price"
               min="1"
               max="3"
               value="{{ restaurant.price if restaurant else 1 }}"
               required
               style="width: 100%; padding: 10px; margin: 10px 0 20px;">

        <label>URL de la fotografía:</label>
        <input type="url"
               name="photoUrl"
               value="{{ restaurant.photoUrl if restaurant else '' }}"
               style="width: 100%; padding: 10px; margin: 10px 0 20px;">

        <button type="submit"
                style="background-color: #2563eb;
                       color: white;
                       padding: 12px 25px;
                       border: none;
                       border-radius: 6px;
                       cursor: pointer;">
            Guardar restaurante
        </button>

        <a href="/restaurants"
           style="margin-left: 10px; color: #2563eb;">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
